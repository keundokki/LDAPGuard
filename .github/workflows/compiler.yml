name: Compiler

on:
  push:
    branches:
      - main
      - develop
      - release/**
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional release version override (e.g. 1.2.3) for manual run"
        required: false

concurrency:
  group: compiler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current version
        id: current_version
        run: |
          current=$(cat VERSION)
          echo "current=${current}" >> "$GITHUB_OUTPUT"

      - name: Resolve publish version
        id: publish
        run: |
          current="${{ steps.current_version.outputs.current }}"
          manual_release="${{ github.event.inputs.release_version }}"
          branch="${{ github.ref }}"

          if [[ -n "${manual_release}" ]]; then
            publish_version="${manual_release}"
          elif [[ "${branch}" == "refs/heads/main" ]]; then
            # Main publishes final version (strip -dev/-rc suffixes).
            publish_version=$(echo "${current}" | sed -E 's/-(dev|rc(\.[0-9]+)?)$//')
          elif [[ "${branch}" == refs/heads/release/* ]]; then
            # Release branch publishes candidate tag.
            if [[ "${current}" =~ -rc(\.[0-9]+)?$ ]]; then
              publish_version="${current}"
            else
              base=$(echo "${current}" | sed -E 's/-dev$//')
              publish_version="${base}-rc"
            fi
          else
            # Develop uses current version (expected to be *-dev).
            publish_version="${current}"
          fi

          echo "publish_version=${publish_version}" >> "$GITHUB_OUTPUT"

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          load: true
          push: false
          tags: ldapguard-api:${{ steps.publish.outputs.publish_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          load: true
          push: false
          tags: ldapguard-web:${{ steps.publish.outputs.publish_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          load: true
          push: false
          tags: ldapguard-worker:${{ steps.publish.outputs.publish_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests inside API image
        run: |
          docker run --rm \
            -v "$PWD/tests:/app/tests" \
            -v "$PWD:/app" \
            -e DATABASE_URL=sqlite+aiosqlite:///./test.db \
            -e REDIS_URL=redis://localhost:6379 \
            -e SECRET_KEY=test-secret-key-minimum-32-characters \
            -e ENCRYPTION_KEY=test-encryption-key-32-bytes-minimum \
            ldapguard-api:${{ steps.publish.outputs.publish_version }} \
            pytest tests

      - name: SonarCloud analysis
        if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=keundokki
            -Dsonar.projectKey=keundokki_LDAPGuard

      - name: SonarCloud Quality Gate
        if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        timeout-minutes: 20
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        run: |
          version="${{ steps.publish.outputs.publish_version }}"
          docker tag ldapguard-api:${version} ghcr.io/keundokki/ldapguard-api:${version}
          docker tag ldapguard-web:${version} ghcr.io/keundokki/ldapguard-web:${version}
          docker tag ldapguard-worker:${version} ghcr.io/keundokki/ldapguard-worker:${version}

          docker push ghcr.io/keundokki/ldapguard-api:${version}
          docker push ghcr.io/keundokki/ldapguard-web:${version}
          docker push ghcr.io/keundokki/ldapguard-worker:${version}

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            docker tag ldapguard-api:${version} ghcr.io/keundokki/ldapguard-api:latest
            docker tag ldapguard-web:${version} ghcr.io/keundokki/ldapguard-web:latest
            docker tag ldapguard-worker:${version} ghcr.io/keundokki/ldapguard-worker:latest

            docker push ghcr.io/keundokki/ldapguard-api:latest
            docker push ghcr.io/keundokki/ldapguard-web:latest
            docker push ghcr.io/keundokki/ldapguard-worker:latest
          fi

      - name: Tag release
        if: github.ref == 'refs/heads/main'
        run: |
          version="${{ steps.publish.outputs.publish_version }}"
          git tag -a "ldapguard-v${version}" -m "Release ${version}" || true
          git push origin "ldapguard-v${version}" || true

      - name: Cleanup Docker images
        if: always()
        run: |
          version="${{ steps.publish.outputs.publish_version }}"
          docker image rm -f \
            ldapguard-api:${version} \
            ldapguard-web:${version} \
            ldapguard-worker:${version} || true
