server {
    listen 80;
    server_name localhost;
    # For Podman, we rely on the default resolver or specify the network's DNS
    # Single service resolution without custom resolver
    
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Use hardcoded reference to service name - Podman will resolve it
        # Strip /api prefix and forward to backend
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location /metrics {
        proxy_pass http://api:8000;
    }
}
