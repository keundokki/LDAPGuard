{{- if not .Values.secrets.existingSecretName }}
# Secret for sensitive LDAPGuard runtime values.
# For production, prefer external secret management and override these values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ldapguard.secretName" . }}
  labels:
    {{- include "ldapguard.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.ldapguard.secretKey | quote }}
  ENCRYPTION_KEY: {{ .Values.ldapguard.encryptionKey | quote }}
  DATABASE_URL: {{ .Values.ldapguard.databaseUrl | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | quote }}
{{- end }}
