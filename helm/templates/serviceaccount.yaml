{{- if .Values.serviceAccount.create }}
# ServiceAccount used by LDAPGuard workloads.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ldapguard.serviceAccountName" . }}
  labels:
    {{- include "ldapguard.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
