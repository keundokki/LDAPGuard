# API deployment (FastAPI service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ldapguard.fullname" . }}-api
  labels:
    {{- include "ldapguard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      {{- include "ldapguard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "ldapguard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "ldapguard.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.backup.enabled }}
      initContainers:
        - name: backup-pvc-check
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              test -d {{ .Values.backup.mountPath }} &&
              test -w {{ .Values.backup.mountPath }}
          volumeMounts:
            - name: backup-storage
              mountPath: {{ .Values.backup.mountPath }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ldapguard.fullname" . }}-config
            - secretRef:
                name: {{ include "ldapguard.secretName" . }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ldapguard.secretName" . }}
                  key: DATABASE_URL
          {{- if .Values.backup.enabled }}
          volumeMounts:
            - name: backup-storage
              mountPath: {{ .Values.backup.mountPath }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
      {{- if .Values.backup.enabled }}
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: {{ include "ldapguard.fullname" . }}-backup
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
